# ============================================================
# ERP Pro - Docker Compose Configuration
# تشغيل النظام المتكامل كمنظومة واحدة
#
# يتضمن:
#   - Next.js Frontend (الواجهة الأمامية)
#   - Frappe/ERPNext Backend (الواجهة الخلفية)
#   - MariaDB (قاعدة البيانات)
#   - Redis (التخزين المؤقت)
#
# للتشغيل: docker compose up -d
#
# ملاحظة ERPNext v16:
#   - الصور الافتراضية: frappe/erpnext:v16
#   - يمكن الرجوع إلى v15 عبر متغير ERPNEXT_VERSION=v15
#   - بعض مسارات API تغيرت في v16 (انظر backend.ts)
#
# INF-10/INF-11 (تدقيق 2026-09):
#   - حُذف حقل version المهمل
#   - MariaDB لم يعد منشوراً خارجياً (داخلي فقط)
#   - Redis ×3 بكلمة سر إلزامية (REDIS_PASSWORD)
#   - لا كلمات سر افتراضية — كل الأسرار إلزامية عبر :?
#   - healthchecks لكل الخدمات الحيوية
# ============================================================

services:
  # ============================================================
  # قاعدة البيانات - MariaDB
  # ============================================================
  mariadb:
    image: mariadb:10.6
    container_name: erppro-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-erppro_db}
      MYSQL_USER: ${DB_USER:-erppro_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/conf.d:/etc/mysql/conf.d
    # INF-10: المنفذ 3306 داخلي فقط — لا منفذ منشور على المضيف
    networks:
      - erppro-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 20s
      retries: 10
      interval: 10s
    deploy:
      resources:
        limits:
          memory: 1500M

  # ============================================================
  # التخزين المؤقت - Redis (كلمة سر إلزامية — INF-10)
  # ============================================================
  redis-cache:
    image: redis:7-alpine
    container_name: erppro-cache
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_cache_data:/data
    networks:
      - erppro-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      timeout: 5s
      retries: 5
      interval: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    deploy:
      resources:
        limits:
          memory: 256M

  redis-queue:
    image: redis:7-alpine
    container_name: erppro-queue
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_queue_data:/data
    networks:
      - erppro-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      timeout: 5s
      retries: 5
      interval: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    deploy:
      resources:
        limits:
          memory: 256M

  redis-socketio:
    image: redis:7-alpine
    container_name: erppro-socketio
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_socketio_data:/data
    networks:
      - erppro-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      timeout: 5s
      retries: 5
      interval: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================================
  # Frappe/ERPNext Backend
  # يعمل داخلياً فقط - لا يُعرض للمستخدم مباشرة
  # ============================================================
  backend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    container_name: erppro-backend
    restart: unless-stopped
    environment:
      FRAPPE_SITE_NAME_HEAD: ${SITE_NAME:-erppro}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-erppro_db}
      DB_USER: ${DB_USER:-erppro_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_CACHE: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-cache:6379
      REDIS_QUEUE: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-queue:6379
      REDIS_SOCKETIO: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-socketio:6379
      SOCKETIO_PORT: 9000
    volumes:
      - backend_sites:/home/frappe/frappe-bench/sites
      - backend_assets:/home/frappe/frappe-bench/sites/assets
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-socketio:
        condition: service_healthy
    networks:
      - erppro-network
    # INF-11: فحص صحة — gunicorn يستمع على 8000
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000'"]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2000M

  # خادم الـ WebSocket الداخلي
  socketio:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    container_name: erppro-socketio-server
    restart: unless-stopped
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      REDIS_CACHE: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-cache:6379
      REDIS_QUEUE: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-queue:6379
      REDIS_SOCKETIO: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-socketio:6379
      SOCKETIO_PORT: 9000
    depends_on:
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-socketio:
        condition: service_healthy
    volumes:
      - backend_sites:/home/frappe/frappe-bench/sites
    networks:
      - erppro-network

  # جدولة المهام الخلفية
  scheduler:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    container_name: erppro-scheduler
    restart: unless-stopped
    command: ["bench", "schedule"]
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-erppro_db}
      DB_USER: ${DB_USER:-erppro_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_CACHE: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-cache:6379
      REDIS_QUEUE: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-queue:6379
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    volumes:
      - backend_sites:/home/frappe/frappe-bench/sites
    networks:
      - erppro-network

  # معالج المهام الخلفية
  worker-default:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    container_name: erppro-worker-default
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "default"]
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-erppro_db}
      DB_USER: ${DB_USER:-erppro_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_CACHE: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-cache:6379
      REDIS_QUEUE: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-queue:6379
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    volumes:
      - backend_sites:/home/frappe/frappe-bench/sites
    networks:
      - erppro-network

  worker-long:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    container_name: erppro-worker-long
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "long"]
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-erppro_db}
      DB_USER: ${DB_USER:-erppro_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_CACHE: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-cache:6379
      REDIS_QUEUE: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-queue:6379
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    volumes:
      - backend_sites:/home/frappe/frappe-bench/sites
    networks:
      - erppro-network

  worker-short:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16}
    container_name: erppro-worker-short
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "short"]
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-erppro_db}
      DB_USER: ${DB_USER:-erppro_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_CACHE: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-cache:6379
      REDIS_QUEUE: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-queue:6379
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    volumes:
      - backend_sites:/home/frappe/frappe-bench/sites
    networks:
      - erppro-network

  # ============================================================
  # Next.js Frontend - الواجهة الأمامية
  # هذه هي الواجهة الوحيدة التي يراها المستخدم
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erppro-frontend
    restart: unless-stopped
    environment:
      # يتواصل مع الباك إند عبر الشبكة الداخلية فقط
      BACKEND_HOST: http://backend:8000
      BACKEND_SITE_NAME: ${SITE_NAME:-erppro}
      BACKEND_ADMIN_USER: ${ADMIN_USER:-Administrator}
      # INF-11: لا كلمة سر افتراضية — إلزامية من .env
      BACKEND_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # ERPNext version — used by backend.ts for API compatibility shims
      BACKEND_VERSION: ${ERPNEXT_VERSION:-v16}
      ERPNEXT_TRY_LOGIN: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      DATABASE_URL: file:/app/data/custom.db
      # MED-03: محدد المعدل عبر Redis المشترك
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis-cache:6379
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
      redis-cache:
        condition: service_healthy
    networks:
      - erppro-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/setup/status').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\""]
      timeout: 10s
      retries: 5
      interval: 15s
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1750M

# ============================================================
# الشبكة الداخلية
# ============================================================
networks:
  erppro-network:
    driver: bridge

# ============================================================
# وحدات التخزين الدائمة
# ============================================================
volumes:
  mariadb_data:
  redis_cache_data:
  redis_queue_data:
  redis_socketio_data:
  backend_sites:
  backend_assets:
