# ============================================================
# ERP Pro — Root Railway Configuration
# ============================================================
# هذا الملف يُستخدم للواجهة الأمامية (Next.js) عند النشر من الجذر
# إذا أردت نشر الـ backend، استخدم Root Directory = railway/backend
# ============================================================

[build]
builder = "dockerfile"

[deploy]
healthcheckPath = "/api/method/ping"
healthcheckTimeout = 600
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
