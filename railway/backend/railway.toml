# ============================================================
# ERP Pro — Railway Backend Configuration
# ============================================================
# هذا الملف يُخبر Railway كيف يبني ويُشغّل خدمة ERPNext Backend
# ============================================================

[build]
builder = "dockerfile"

[deploy]
# فحص الصحة — Frappe يوفر /api/method/ping
healthcheckPath = "/api/method/ping"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

# المنافذ التي يستمع إليها التطبيق
# Railway سيقوم بتعيين PORT تلقائياً إذا لزم الأمر
