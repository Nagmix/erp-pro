# ============================================================
# ERP Pro — Supervisor Configuration for Railway
# ============================================================
# يُشغّل جميع خدمات ERPNext في حاوية واحدة
# Redis URLs تُقرأ من common_site_config.json
# ============================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

# ============================================================
# gunicorn — Frappe/ERPNext WSGI Server
# ============================================================
[program:gunicorn]
command=/home/frappe/frappe-bench/env/bin/gunicorn
    -b 0.0.0.0:%(ENV_PORT)s
    -w %(ENV_GUNICORN_WORKERS)s
    -t %(ENV_FRAPPE_WORKER_TIMEOUT)s
    --preload
    wsgi_wrapper:application
user=frappe
directory=/home/frappe/frappe-bench
environment=FRAPPE_SITE_NAME="%(ENV_SITE_NAME)s"
autostart=true
autorestart=true
startsecs=5
startretries=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

# ============================================================
# scheduler — Frappe Background Scheduler
# ============================================================
[program:scheduler]
command=/home/frappe/frappe-bench/env/bin/bench schedule
user=frappe
directory=/home/frappe/frappe-bench
environment=FRAPPE_SITE_NAME="%(ENV_SITE_NAME)s"
autostart=true
autorestart=true
startsecs=10
startretries=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

# ============================================================
# worker-default — Default Queue Worker
# ============================================================
[program:worker-default]
command=/home/frappe/frappe-bench/env/bin/bench worker --queue default
user=frappe
directory=/home/frappe/frappe-bench
environment=FRAPPE_SITE_NAME="%(ENV_SITE_NAME)s"
autostart=true
autorestart=true
startsecs=5
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

# ============================================================
# worker-long — Long-Running Queue Worker
# ============================================================
[program:worker-long]
command=/home/frappe/frappe-bench/env/bin/bench worker --queue long
user=frappe
directory=/home/frappe/frappe-bench
environment=FRAPPE_SITE_NAME="%(ENV_SITE_NAME)s"
autostart=true
autorestart=true
startsecs=5
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

# ============================================================
# worker-short — Short-Lived Queue Worker
# ============================================================
[program:worker-short]
command=/home/frappe/frappe-bench/env/bin/bench worker --queue short
user=frappe
directory=/home/frappe/frappe-bench
environment=FRAPPE_SITE_NAME="%(ENV_SITE_NAME)s"
autostart=true
autorestart=true
startsecs=5
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30

# ============================================================
# socketio — Frappe Realtime WebSocket Server
# Reads redis_socketio from common_site_config.json
# ============================================================
[program:socketio]
command=/home/frappe/frappe-bench/env/bin/node /home/frappe/frappe-bench/apps/frappe/socketio.js
user=frappe
directory=/home/frappe/frappe-bench
environment=SOCKETIO_PORT="%(ENV_SOCKETIO_PORT)s",FRAPPE_SITE_NAME="%(ENV_SITE_NAME)s"
autostart=true
autorestart=true
startsecs=5
startretries=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
